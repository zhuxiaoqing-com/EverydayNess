plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

sourceSets {
    main {
        java {
            srcDirs += 'src/main/java'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'io.netty:netty-all:4.1.112.Final'
    implementation 'org.yaml:snakeyaml:2.0'

    implementation group: 'org.zeromq', name: 'jeromq', version: '0.5.4'
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.3.2'
    implementation 'org.agrona:agrona:2.5.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'

    implementation project(':core:gencode:apt-annotation')
    annotationProcessor project(':core:gencode:apt-compiler')
}

tasks.withType(JavaCompile) {
    options.compilerArgs.addAll(['--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'])
//        options.compilerArgs.addAll(['-Xlint:unchecked'])
}

test {
    useJUnitPlatform()
    jvmArgs '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
}
