

plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

def commonRpcProxyDir = rootProject.file('common/src/gen/java/org/evd/game/common/proxy')

repositories {
    mavenCentral()
}

configurations {
    dbDefImplementation.extendsFrom implementation
}

sourceSets {
    dbDef {
        java {
            srcDirs = ['src/dbDef/java']
        }
    }

    main {
        java {
            srcDirs = ['src/main/java']

            // 只把 dbDef APT 生成源码给 main generatedSourceOutputDirectory这里指向的目录就是dbDef生成的目录
            srcDir(tasks.named('compileDbDefJava', JavaCompile).flatMap {
                it.options.generatedSourceOutputDirectory
            })
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation project(":core:gencode:apt-annotation")
    dbDefImplementation project(":core:gencode:apt-annotation")

    annotationProcessor project(':core:gencode:apt-compiler')
    dbDefAnnotationProcessor project(':core:gencode:apt-compiler')

    implementation project(':core:runtime')
    dbDefImplementation project(':core:runtime')

    implementation project(':common')
    dbDefImplementation project(':common')
}

// 这里默认 DbDef 的编译
tasks.named('compileDbDefJava', JavaCompile) {
    options.incremental = false
    // 不要 -proc:only
    // 需要正常产出 build/classes/java/dbDef，给下一次增量编译用
    options.compilerArgs += [
            '-processor',
            'org.evd.game.gencode.db.DbDirtyEntityProcessor'
    ]
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('compileDbDefJava')

    //compileJava 这个任务和 commonRpcProxyDir 目录有关。
    //如果这个目录里的文件变了，compileJava 应该重新执行。
    inputs.dir(commonRpcProxyDir)
            .withPropertyName('commonRpcProxyDir')
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .optional()
}

test {
    useJUnitPlatform()
}
