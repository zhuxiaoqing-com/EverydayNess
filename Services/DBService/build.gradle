

plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

def commonRpcProxyDir = rootProject.file("common/src/gen/java/org/evd/game/common/proxy/${project.name}")
def commonRpcProxyInputs = providers.provider {
    commonRpcProxyDir.exists() ? fileTree(commonRpcProxyDir) : files()
}

repositories {
    mavenCentral()
}
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation project(':core:gencode:apt-annotation')
    annotationProcessor project(':core:gencode:apt-compiler')
    implementation project(':core:runtime')
    implementation project(':common')
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.mongodb:mongo-java-driver:3.12.14'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
}

tasks.named('compileJava', JavaCompile) {
    inputs.files(commonRpcProxyInputs)
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .optional()
}

test {
    useJUnitPlatform()
}
