dbConfigPath: db-dev.yml

nodes:
  - name: node1 # 节点
    addr: tcp://127.0.0.1:15001
    schedule:
      - name: logic  #线程池名
        num: 10
        services:
        - serviceType: CONN
          name: conn
          publicAddr: 0.0.0.0:18080
        - serviceType: LOC
          name: location
          num: -1
        - serviceType: DB
          name: db
          num: 5
          interval: 100
        - serviceType: PLAYER
          name: player
          num: 2
        - serviceType: SCENE_MANAGER
          name: sceneManager
        - serviceType: LOBBY
          name: lobby
        - serviceType: ONLINE
          name: online
        - serviceType: STAGE
          name: stage
          num: 2

  - name: node2 # 节点
    addr: tcp://127.0.0.1:15002
    schedule:
      - name: logic  #线程池
        num: 10
        services:
        - serviceType: GSTAGE
          name: gStage
          num: 2
      - name: io  #线程池
