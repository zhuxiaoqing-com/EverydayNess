infraConfig: infra-dev.yml

nodes:
  - name: node1 # 节点
    addr: tcp://127.0.0.1:15001
    schedule:
      - name: logic  #线程池名
        num: 10
        services:
        - serviceType: CONN
          name: conn
          num: 1
          interval: 5
          publicAddr: 0.0.0.0:18080
        - serviceType: LOC
          name: location
          num: -1
          interval: 5
        - serviceType: DB
          name: db
          num: -1
          interval: 5
        - serviceType: PLAYER
          name: player
          num: 2
          interval: 5
        - serviceType: STAGE
          name: stage
          num: 2
          interval: 5

  - name: node2 # 节点
    addr: tcp://127.0.0.1:15002
    schedule:
      - name: logic  #线程池
        num: 10
        services:
        - serviceType: GSTAGE
          name: gStage
          num: 2
          interval: 5
      - name: io  #线程池
