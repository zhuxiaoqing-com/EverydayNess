dbConfigPath: db-dev.yml
dbTopology: REMOTE_SERVICE
debug: true
platformId: 0  #平台id
serverId: 0 #服务器id;

nodes:
  - nodeId: 0
    name: 游戏服节点
    nodeType: GAME
    addr: 127.0.0.1:15001
    linkLevel: 0
    schedule:
      - name: logic  #线程池名
        num: 10
        services:
        - serviceType: ADMIN
          name: admin
          publicAddr: 0.0.0.0:10000
        - serviceType: CONN
          name: conn
          publicAddr: 0.0.0.0:18080
        - serviceType: LOC
          name: location
          num: -1
        - serviceType: DB
          name: db
          num: 1
          interval: 100
        - serviceType: PLAYER
          name: player
          num: 2
        - serviceType: SCENE_MANAGER
          name: sceneManager
        - serviceType: LOBBY
          name: lobby
        - serviceType: SDK
          name: sdk
        - serviceType: STAGE
          name: stage
          num: 2

  - nodeId: 1
    name: 大跨服节点
    nodeType: GLOBAL
    addr: 127.0.0.1:15002
    linkLevel: 1
    schedule:
      - name: logic  #线程池
        num: 10
        services:
        - serviceType: GSTAGE
          name: gStage
          num: 2
      - name: io  #线程池
