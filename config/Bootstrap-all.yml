infraConfig: infra-dev.yml

nodes:
  - name: node1 # 节点
    addr: tcp://127.0.0.1:15001
    schedule:
      - name: logic  #线程池名
        num: 10
        services:
        - className: ConnService
          name: conn
          num: 1
          interval: 5
          publicAddr: 0.0.0.0:18080
        - className: LocationService
          name: location
          num: -1
          interval: 5
        - className: DBService
          name: db
          num: -1
          interval: 5
        - className: PlayerService
          name: player
          num: 2
          interval: 5
        - className: StageService
          name: stage
          num: 2
          interval: 5

  - name: node2 # 节点
    addr: tcp://127.0.0.1:15002
    schedule:
      - name: logic  #线程池
        num: 10
        services:
        - className: StageService
          name: stage
          num: 2
          interval: 5
        - className: PlayerService
          name: player
          num: 2
          interval: 5

      - name: io  #线程池
