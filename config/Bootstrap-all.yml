dbConfigPath: db-dev.yml
debug: true

nodes:
  - name: node1 # 节点
    # dbTopology: NODE_LOCAL 时移除本节点的 DB Service，并关闭 db-dev.yml 的 enableMemoryCache。
    addr: 127.0.0.1:15001
    linkLevel: 0
    platformId: 0  #平台id
    zone: 0  #战区区分;某些服务器在同一个战区这样;
    serverId: 0 #服务器id;
    schedule:
      - name: logic  #线程池名
        num: 10
        services:
        - serviceType: ADMIN
          name: admin
          publicAddr: 0.0.0.0:10000
        - serviceType: CONN
          name: conn
          publicAddr: 0.0.0.0:18080
        - serviceType: LOC
          name: location
          num: -1
        - serviceType: DB
          name: db
          num: 1
          interval: 100
        - serviceType: PLAYER
          name: player
          num: 2
        - serviceType: SCENE_MANAGER
          name: sceneManager
        - serviceType: LOBBY
          name: lobby
        - serviceType: SDK
          name: sdk
        - serviceType: STAGE
          name: stage
          num: 2

  - name: node2 # 节点
    addr: 127.0.0.1:15002
    linkLevel: 1
    schedule:
      - name: logic  #线程池
        num: 10
        services:
        - serviceType: GSTAGE
          name: gStage
          num: 2
      - name: io  #线程池
